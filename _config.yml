# Qing Li's homepage, adapted for the original RayeRen / AcadHomepage Jekyll theme.
# Based on the MIT-licensed upstream: https://github.com/RayeRen/acad-homepage.github.io
# This file replaces the upstream _config.yml.

title                    : "Qing Li | Homepage"
description              : "Training Data Optimization<br>Structured Data Generation"
repository               : "qing-lll/qing-lll.github.io"
url                      : "https://qing-lll.github.io"
baseurl                  : ""
# No Google Scholar profile has been provided; do not display fake citation counts.
google_scholar_stats_use_cdn : false

google_analytics_id      :
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

author:
  name             : "Qing Li | 李晴"
  avatar           : "images/photo.JPG"  # Replace with images/photo.jpg and update this path.
  bio              : "Ph.D. Student at<br>Shanghai Jiao Tong University"
  location         : "Shanghai, China"
  employer         : "Shanghai Jiao Tong University"
  email            : "qing15@sjtu.edu.cn" # Verified from public paper; change if preferred.
  github           : "qing-lll"
  googlescholar    :  # Add YOUR actual profile link after you create it.
  dblp             :
  orcid            :
  linkedin         :
  researchgate     :
  pubmed           :
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :

include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Asia/Shanghai
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
